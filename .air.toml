root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./apps/server"
  delay = 300
  exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "node_modules",
    "apps/web",
    "dist",
    "packages",
    "spec/generated",
    "db/migrations",
    ".agents",
    ".github",
    "docs",
    "tools"
  ]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
