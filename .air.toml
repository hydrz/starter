# Config file for Air (Go hot-reload)
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./apps/server"
bin = "./tmp/server"
include_ext = ["go", "sql"]
exclude_dir = ["apps/web", "dist", "tmp", "docs", "spec", ".agents", "internal/platform/webui/dist"]
include_dir = ["apps/server", "internal", "db"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
