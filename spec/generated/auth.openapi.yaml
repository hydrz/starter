      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequestInput'
  /api/auth/webauthn/authentication/begin:
    post:
      operationId: beginWebAuthnAuthentication
      summary: Begin a discoverable (usernameless) passkey sign-in
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnAuthenticationBeginResponse'
      tags:
        - Auth
  /api/auth/webauthn/authentication/finish:
    post:
      operationId: finishWebAuthnAuthentication
      summary: Finish a passkey sign-in and complete sign-in
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallengeBody'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
