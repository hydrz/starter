        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegistrationFinishInput'
components:
  schemas:
    APIKey:
      type: object
      required:
        - id
        - name
        - prefix
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    APIKeyCreateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        expiresAt:
          type: string
          format: date-time
    AccessTokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreatedAPIKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
      allOf:
        - $ref: '#/components/schemas/APIKey'
    EmailOTPRequestInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    EmailOTPVerifyInput:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
    Identity:
      type: object
      required:
        - id
        - email
        - emailVerified
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MFAChallengeBody:
      type: object
      required:
        - mfaRequired
        - challengeId
      properties:
        mfaRequired:
          type: boolean
          enum:
            - true
        challengeId:
          type: string
    MFAChallengeVerifyInput:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
        code:
          type: string
          minLength: 1
    OAuthAccount:
      type: object
      required:
        - provider
        - subject
        - createdAt
      properties:
        provider:
          $ref: '#/components/schemas/OAuthProvider'
        subject:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    OAuthAuthorizationResponse:
      type: object
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
    OAuthCallbackInput:
      type: object
      required:
        - state
        - code
      properties:
        state:
          type: string
        code:
          type: string
    OAuthProvider:
      type: string
      enum:
        - google
        - github
    PasswordResetConfirmInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    PasswordSignInInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    Session:
      type: object
      required:
        - id
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type: string
        ipAddress:
          type: string
    SignUpInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    TOTPEnrollmentBeginResponse:
      type: object
      required:
        - factorId
        - secret
        - otpauthUrl
      properties:
        factorId:
          type: string
        secret:
          type: string
        otpauthUrl:
          type: string
