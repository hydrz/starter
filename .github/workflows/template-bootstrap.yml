name: Initialize template repository

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      display_name:
        description: Optional human-readable project name
        required: false
        type: string
      module:
        description: Optional Go module path (defaults to github.com/owner/repository)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: template-bootstrap
  cancel-in-progress: false

jobs:
  initialize:
    if: github.repository != 'hydrz/starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Initialize names from repository
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          MODULE_PATH: ${{ inputs.module }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY")
          if [[ -n "$DISPLAY_NAME" ]]; then args+=(--display-name "$DISPLAY_NAME"); fi
          if [[ -n "$MODULE_PATH" ]]; then args+=(--module "$MODULE_PATH"); fi
          node tools/initialize-template.mjs "${args[@]}"
      - name: Commit initialized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No template substitutions were required."
            exit 0
          fi
          git commit -m "chore: initialize project from template"
          git push
