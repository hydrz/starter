name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag contents
        run: pnpm check && pnpm test && pnpm build
      - name: Build release binary
        run: >-
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -tags production -trimpath
          -ldflags "-s -w -X main.version=$GITHUB_REF_NAME -X main.commit=$GITHUB_SHA -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -o dist/server ./apps/server
      - name: Create binary checksum
        run: sha256sum dist/server > dist/server.sha256
      - name: Build container image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker build \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE,,}:$GITHUB_REF_NAME" \
            --tag "${IMAGE,,}:latest" .
      - name: Push container image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE,,}:$GITHUB_REF_NAME"
          docker push "${IMAGE,,}:latest"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/server
          dist/server.sha256
          --draft
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
