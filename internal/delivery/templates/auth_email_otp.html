<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your sign-in code</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #172b4d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="min-height: 100vh; background-color: #f4f5f7; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width: 560px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 40px;">
          <tr>
            <td>
              <h2 style="margin: 0 0 16px; font-size: 24px; font-weight: 600; color: #091e42;">Your sign-in code</h2>
              <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #42526e;">
                Use this code to sign in to {{.AppName}}.
              </p>
              <div style="background-color: #f8f9fa; border: 1px solid #dfe1e6; border-radius: 6px; padding: 16px; text-align: center; margin-bottom: 24px;">
                <span style="font-family: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: 4px; color: #0052cc;">{{.Token}}</span>
              </div>
              <p style="margin: 0 0 16px; font-size: 14px; color: #6b778c;">
                This code will expire in {{.ExpiresIn}}. If you did not request it, you can safely ignore this email.
              </p>
              <hr style="border: none; border-top: 1px solid #ebecf0; margin: 24px 0 16px;">
              <p style="margin: 0; font-size: 12px; color: #8993a4; text-align: center;">
                &copy; {{.AppName}}. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
