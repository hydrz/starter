components:
  parameters:
    Common.PaginationQuery.limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
    Common.PaginationQuery.offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      explode: false
  schemas:
    APIKey:
      type: object
      required:
        - id
        - name
        - prefix
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    APIKeyCreateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationInput:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    AccessTokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
    Announcement:
      type: object
      required:
        - id
        - organizationId
        - title
        - content
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AnnouncementInput:
      type: object
      required:
        - title
        - content
        - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        content:
          type: string
          minLength: 1
          maxLength: 10000
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
    AnnouncementStatus:
      type: string
      enum:
        - draft
        - published
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    BillingSummary:
      type: object
      required:
        - organizationId
        - hasActiveSubscription
        - entitlements
      properties:
        organizationId:
          type: string
          format: uuid
        hasActiveSubscription:
          type: boolean
        subscription:
          $ref: '#/components/schemas/SubscriptionSummary'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementSummary'
    CheckoutSessionResponse:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
    Common.PreconditionFailedResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ApiError'
    CreateCheckoutSessionInput:
      type: object
      required:
        - priceKey
      properties:
        priceKey:
          type: string
          minLength: 1
          maxLength: 100
    CreateInvitationInput:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/OrganizationRole'
    CreateOrganizationInput:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 120
    CreatedAPIKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
      allOf:
        - $ref: '#/components/schemas/APIKey'
    CreatedInvitationResponse:
      type: object
      required:
        - invitation
        - token
      properties:
        invitation:
          $ref: '#/components/schemas/OrganizationInvitation'
        token:
          type: string
    EmailOTPRequestInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    EmailOTPVerifyInput:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
    EntitlementSummary:
      type: object
      required:
        - featureKey
        - enabled
      properties:
        featureKey:
          type: string
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    Identity:
      type: object
      required:
        - id
        - email
        - emailVerified
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MFAChallengeBody:
      type: object
      required:
        - mfaRequired
        - challengeId
      properties:
        mfaRequired:
          type: boolean
          enum:
            - true
        challengeId:
          type: string
    MFAChallengeVerifyInput:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
        code:
          type: string
          minLength: 1
    OAuthAccount:
      type: object
      required:
        - provider
        - subject
        - createdAt
      properties:
        provider:
          $ref: '#/components/schemas/OAuthProvider'
        subject:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    OAuthAuthorizationResponse:
      type: object
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
    OAuthCallbackInput:
      type: object
      required:
        - state
        - code
      properties:
        state:
          type: string
        code:
          type: string
    OAuthProvider:
      type: string
      enum:
        - google
        - github
    Organization:
      type: object
      required:
        - id
        - slug
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationInvitation:
